<script>
/* ── answer matching ──────────────────────────────────────── */
function norm(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")   // é → e
    .replace(/&/g," and ")
    .replace(/[^a-z0-9 ]/g," ")                        // punctuation out
    .replace(/\s+/g," ").trim()
    .replace(/^the /,"");
}

function lev(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}

function close(a,b){
  if(a===b) return true;
  const long=Math.max(a.length,b.length);
  if(long<4) return false;
  return 1 - lev(a,b)/long >= 0.85;          // tolerates a typo or two
}

// second pass: drop filler words, so "Enter THE Sandman" still lands
const FILLER = /\b(the|a|an|and|of|to|in|on|my|is)\b/g;
function loose(s){ return norm(s).replace(FILLER," ").replace(/\s+/g," ").trim(); }

function correct(raw, p){
  const g = norm(raw), gl = loose(raw);
  if(g.length < 2) return false;
  const answers = [p.song, ...(p.aliases||[])];
  return answers.some(ans=>{
    const a = norm(ans), al = loose(ans);
    if(close(g,a) || close(gl,al)) return true;
    // "sandman" for "enter sandman" — needs to be a real chunk of the title
    const part = (full,part)=> part.length>=5 && full.includes(part) && part.length>=full.length*0.5;
    return part(a,g) || part(al,gl);
  });
}

/* ── state ────────────────────────────────────────────────── */
let deck=[], cur=null, ab=0, hits=0, streak=0, best=0, hintStage=0, done=false;

const $ = id => document.getElementById(id);
const wave = $("wave");

for(let i=0;i<44;i++) wave.appendChild(document.createElement("i"));
const bars = [...wave.children];

function drawWave(amp){
  bars.forEach((b,i)=>{
    const shape = Math.sin(i/44*Math.PI);                 // taper at the ends
    const jitter = 0.45 + 0.55*Math.abs(Math.sin(i*2.7));
    b.style.height = (6 + amp*shape*jitter*88) + "%";
  });
}
drawWave(0);

function shuffle(){
  deck = PLAYERS.map((p,i)=>i);
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
}

function skeleton(title){
  return title.split(" ").map(w=>{
    const letters = w.replace(/[^A-Za-z0-9]/g,"");
    if(!letters) return w;
    return w[0] + "·".repeat(Math.max(letters.length-1,0));
  }).join("   ");
}

function stepUp(){
  if(!deck.length) shuffle();
  cur = PLAYERS[deck.pop()];
  done=false; hintStage=0;

  $("name").textContent = cur.name;
  $("pos").textContent  = cur.pos;
  $("meta").innerHTML   = `<em>${cur.team}</em> · <span class="years">${cur.years}</span>`;
  $("eyebrow").textContent = "Now batting";

  $("guess").value=""; $("guess").disabled=false;
  $("say").textContent=""; $("say").className="say";
  $("hints").className="hints"; $("hints").innerHTML="";
  $("reveal").className="reveal";
  $("screen").replaceChildren();   // kill the old iframe so its audio stops
  $("hint").disabled=false; $("give").disabled=false;
  wave.className="wave"; drawWave(0);
  $("guess").focus();
  $("pool").textContent = PLAYERS.length +
    (PLAYERS.length === 1 ? " batter in the lineup" : " batters in the lineup");
}

function score(){
  $("s-ab").textContent=ab; $("s-hit").textContent=hits;
  $("s-strk").textContent=streak; $("s-best").textContent=best;
}

function reveal(won){
  done=true;
  ab++;
  if(won){ hits++; streak++; best=Math.max(best,streak); }
  else streak=0;
  score();

  $("guess").disabled=true;
  $("hint").disabled=true; $("give").disabled=true;
  $("eyebrow").textContent = won ? "That's the one" : "The answer";

  wave.className = "wave " + (won?"hit":"miss");
  drawWave(won?1:0.18);

  $("verdict").textContent = won
    ? (hintStage ? "Hit — with help" : "Base hit")
    : "Struck out";
  $("verdict").className = "verdict" + (won?"":" cold");
  $("song").textContent = cur.song;
  $("by").textContent = cur.artist;

  const screen = $("screen"), link = $("listen");
  if(cur.yt){
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + cur.yt + "?rel=0";
    f.title = cur.song + " — " + cur.artist;
    f.allow = "accelerometer; encrypted-media; picture-in-picture";
    f.allowFullscreen = true;
    f.loading = "lazy";
    screen.replaceChildren(f);
    link.href = "https://www.youtube.com/watch?v=" + cur.yt;
    link.textContent = "Open on YouTube";
  } else {
    screen.replaceChildren(
      Object.assign(document.createElement("div"),
        {className:"gap", textContent:"No video on file yet"}));
    link.href = "https://www.youtube.com/results?search_query=" +
                encodeURIComponent(cur.artist + " " + cur.song);
    link.textContent = "Search YouTube";
  }

  $("flag").textContent = cur.check || "";
  $("flag").style.display = cur.check ? "inline-block" : "none";
  $("reveal").className = "reveal on";
  $("next").focus();
}

/* ── input ────────────────────────────────────────────────── */
$("guess").addEventListener("input", e=>{
  if(done) return;
  const n = Math.min(e.target.value.length/22, 1);
  wave.className = n>0 ? "wave armed" : "wave";
  drawWave(n*0.85);
});

function call(){
  if(done) return;
  const v = $("guess").value.trim();
  if(!v){ $("guess").focus(); return; }
  if(correct(v,cur)) reveal(true);
  else{
    $("say").textContent = "Not it. Try again, or take a hint.";
    $("say").className="say no";
    $("guess").select();
  }
}

$("play").addEventListener("click", call);
$("guess").addEventListener("keydown", e=>{ if(e.key==="Enter") call(); });

$("hint").addEventListener("click", ()=>{
  if(done) return;
  hintStage++;
  const box = $("hints");
  box.className="hints on";
  if(hintStage===1){
    box.insertAdjacentHTML("beforeend",
      `<p>Artist &nbsp;·&nbsp; <b style="letter-spacing:0">${cur.artist}</b></p>`);
  } else if(hintStage===2){
    box.insertAdjacentHTML("beforeend",
      `<p>Title &nbsp;·&nbsp; <b>${skeleton(cur.song)}</b></p>`);
    $("hint").disabled=true;
  }
});

$("give").addEventListener("click", ()=>{ if(!done) reveal(false); });
$("next").addEventListener("click", stepUp);
document.addEventListener("keydown", e=>{
  // the Next button handles its own Enter — don't advance twice
  if(done && e.key==="Enter" && e.target.id!=="next"){ e.preventDefault(); stepUp(); }
});

shuffle(); score(); stepUp();
</script>
</body>
</html>
